
name: Sentinel Casework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Python tests and detection evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete Python test suite
        run: python -m unittest discover -s tests -v

      - name: Evaluate identity scenarios
        run: python -m sentinel_casework.evaluate

      - name: Evaluate endpoint scenarios
        run: python -m sentinel_casework.endpoint_evaluation

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-evaluation-reports
          path: |
            data/evaluation.json
            data/endpoint_evaluation.json
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build React
        run: npm run build